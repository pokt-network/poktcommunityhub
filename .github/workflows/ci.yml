name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version from package.json's packageManager field, so CI and laptops agree.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  image:
    name: image + compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Throwaway credentials for a database that lives for one job.
      - name: Write CI env files
        run: |
          pw="$(openssl rand -hex 24)"
          umask 077
          printf 'POSTGRES_USER=community\nPOSTGRES_DB=community\nPOSTGRES_PASSWORD=%s\n' "$pw" > .env.db
          printf 'DATABASE_URL=postgres://community:%s@postgres:5432/community\nLOG_LEVEL=info\n' "$pw" > .env.web

      # docker-compose.yml alone (no Cherry AS override) publishes web on loopback.
      - name: Build
        run: GIT_COMMIT="${GITHUB_SHA::12}" docker compose build web

      - name: Assert the image names this commit
        run: |
          label="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' pocket-community-web:latest)"
          test "$label" = "${GITHUB_SHA::12}" || { echo "image labelled '$label'"; exit 1; }

      - name: Up, waiting on health checks
        run: docker compose up -d --no-build --wait --wait-timeout 120

      - name: Smoke
        run: |
          curl -fsS http://127.0.0.1:3000/health/live | tee /dev/stderr | grep -q "${GITHUB_SHA::12}"
          curl -fsS http://127.0.0.1:3000/health/ready | tee /dev/stderr | grep -q '"ready"'
          curl -fsS http://127.0.0.1:3000/ | grep -q 'POKT Community Hub'
          # Static assets are outside the standalone trace; a missing COPY shows here.
          css="$(curl -fsS http://127.0.0.1:3000/ | grep -o '/_next/static/[^"]*\.css' | head -1)"
          test -n "$css" && curl -fsS -o /dev/null "http://127.0.0.1:3000$css"
          curl -fsS -o /dev/null http://127.0.0.1:3000/pokt-mark.svg
          # Security headers on every response.
          curl -fsSI http://127.0.0.1:3000/ | grep -qi '^x-frame-options: DENY'

      - name: Readiness fails closed without the database
        run: |
          docker compose stop postgres
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/health/ready)"
          test "$code" = 503 || { echo "readiness answered $code with the database down"; exit 1; }

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Down
        if: always()
        run: docker compose down -v
