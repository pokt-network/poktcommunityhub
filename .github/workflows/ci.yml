name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version from package.json's packageManager field, so CI and laptops agree.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  integration:
    name: migrations + database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: community
          POSTGRES_PASSWORD: community
          POSTGRES_DB: community
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U community -d community"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://community:community@localhost:5432/community
      PGPASSWORD: community
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Migrate up
        run: pnpm migrate

      # The count is derived, never written down: a literal that happens to equal
      # today's count stops testing a full teardown the day a migration is added.
      - name: Migrate all the way down
        run: |
          count=$(ls packages/store/migrations/*.sql | wc -l)
          node apps/migrator/node_modules/node-pg-migrate/bin/node-pg-migrate.js down "$count"             --migrations-dir packages/store/migrations --migration-file-language sql

      # A failed command is not the only failure: a down that drops a table but
      # orphans its trigger function or domain makes the next up fail in a way
      # that looks nothing like its cause.
      - name: Assert the teardown left nothing behind
        run: |
          left=$(psql -h localhost -U community -d community -tAc "
            SELECT coalesce(string_agg(name, ', '), '') FROM (
              SELECT table_name AS name FROM information_schema.tables
               WHERE table_schema = 'public' AND table_name <> 'pgmigrations'
              UNION ALL SELECT routine_name FROM information_schema.routines WHERE routine_schema = 'public'
              UNION ALL SELECT DISTINCT trigger_name FROM information_schema.triggers WHERE trigger_schema = 'public'
              UNION ALL SELECT domain_name FROM information_schema.domains WHERE domain_schema = 'public'
            ) survivors")
          if [ -n "$left" ]; then echo "::error::migrate down left objects behind: $left"; exit 1; fi
          echo "Clean: only pgmigrations remains."

      - name: Migrate back up
        run: pnpm migrate

      # REQUIRE_DATABASE_TESTS turns a missing database into a failure. Without it
      # the integration suites skip, and this job would pass having tested nothing.
      - name: Integration and adversarial tests
        env:
          DATABASE_TEST_URL: postgres://community:community@localhost:5432/community
          REQUIRE_DATABASE_TESTS: '1'
        run: pnpm test

  image:
    name: image + compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Throwaway credentials for a database that lives for one job.
      - name: Write CI env files
        run: |
          pw="$(openssl rand -hex 24)"
          umask 077
          printf 'POSTGRES_USER=community\nPOSTGRES_DB=community\nPOSTGRES_PASSWORD=%s\n' "$pw" > .env.db
          printf 'DATABASE_URL=postgres://community:%s@postgres:5432/community\nLOG_LEVEL=info\n' "$pw" > .env.web
          # Sign-in config that parses but reaches no real Discord application.
          {
            printf 'AUTH_URL=http://localhost:3000\n'
            printf 'AUTH_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'AUTH_DISCORD_ID=100000000000000001\nAUTH_DISCORD_SECRET=ci-not-a-secret\n'
            printf 'DISCORD_GUILD_ID=100000000000000002\nADMIN_BOOTSTRAP_DISCORD_IDS=\n'
            # A token Discord would refuse; with no linked ranks and announcements
            # off, the worker never sends it.
            printf 'DISCORD_BOT_TOKEN=ci-not-a-token\n'
            printf 'SETTINGS_ENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)"
          } >> .env.web

      # docker-compose.yml alone (no Cherry AS override) publishes web on loopback.
      # Every image by name: `migrate` is in the tools profile, which a plain
      # `docker compose build` skips.
      - name: Build
        run: GIT_COMMIT="${GITHUB_SHA::12}" docker compose --profile tools build web worker migrate

      - name: Assert every image names this commit
        run: |
          for image in pocket-community-web pocket-community-worker pocket-community-migrate; do
            label="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image:latest")"
            test "$label" = "${GITHUB_SHA::12}" || { echo "$image labelled '$label'"; exit 1; }
          done

      - name: Up, waiting on health checks
        run: docker compose up -d --no-build --wait --wait-timeout 120

      # Health is served on an unmigrated database: the app never migrates itself
      # and must not crash-loop waiting for someone else to.
      - name: Healthy before migrations
        run: curl -fsS http://127.0.0.1:3000/health/ready | grep -q '"ready"'

      - name: Migrate through the image
        run: |
          docker compose --profile tools run --rm --pull never migrate | tee migrate.log
          grep -q '^OK: all' migrate.log
          # A second run applies nothing and still verifies.
          docker compose --profile tools run --rm --pull never migrate | grep -q '^pending   0'

      - name: Smoke
        run: |
          curl -fsS http://127.0.0.1:3000/health/live | tee /dev/stderr | grep -q "${GITHUB_SHA::12}"
          curl -fsS http://127.0.0.1:3000/health/ready | tee /dev/stderr | grep -q '"ready"'
          curl -fsS http://127.0.0.1:3000/ | grep -q 'POKT Community Hub'
          # Static assets are outside the standalone trace; a missing COPY shows here.
          css="$(curl -fsS http://127.0.0.1:3000/ | grep -o '/_next/static/[^"]*\.css' | head -1)"
          test -n "$css" && curl -fsS -o /dev/null "http://127.0.0.1:3000$css"
          curl -fsS -o /dev/null http://127.0.0.1:3000/pokt-mark.svg
          # Security headers on every response.
          curl -fsSI http://127.0.0.1:3000/ | grep -qi '^x-frame-options: DENY'
          curl -fsSI http://127.0.0.1:3000/ | grep -qi "^content-security-policy: default-src 'self'"

      - name: Sign-in is wired and gated
        run: |
          base=http://127.0.0.1:3000
          curl -fsS "$base/signin" | grep -q 'Sign in with Discord'
          # The OAuth redirect is built from AUTH_URL, not from the container's address.
          curl -fsS "$base/api/auth/providers" \
            | grep -q '"callbackUrl":"http://localhost:3000/api/auth/callback/discord"'
          # Signed out, the profile and every console page send you to sign in.
          for path in /me /admin /admin/review /admin/quests /admin/quests/new /admin/categories \
            /admin/ranks /admin/users /admin/discord; do
            location="$(curl -s -o /dev/null -w '%{redirect_url}' "$base$path")"
            case "$location" in
              */signin) ;;
              *) echo "$path redirected to '$location', expected /signin"; exit 1 ;;
            esac
          done
          # A forged session cookie is just a signed-out visitor.
          location="$(curl -s -o /dev/null -w '%{redirect_url}' \
            -b "authjs.session-token=$(printf '0%.0s' $(seq 64))" "$base/admin")"
          case "$location" in */signin) ;; *) echo "forged cookie reached '$location'"; exit 1 ;; esac

      - name: Ambassador pages are wired and gated
        run: |
          base=http://127.0.0.1:3000
          some_id=00000000-0000-0000-0000-000000000000
          # The demo seed refuses without its opt-in, then loads.
          if docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            < tools/seed-demo.sql; then
            echo "the demo seed ran without its opt-in"; exit 1
          fi
          { echo "SET community.seed = 'demo';"; cat tools/seed-demo.sql; } \
            | docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          # Public: the board (live quests only) and the leaderboard.
          board="$(curl -fsS "$base/")"
          echo "$board" | grep -q 'Run a RelayMiner on testnet'
          if echo "$board" | grep -q 'Spring AMA recap'; then echo "an ended quest is on the board"; exit 1; fi
          # Captured first: with pipefail, curl into an early-exiting grep -q can fail.
          leaders="$(curl -fsS "$base/leaderboard")"
          echo "$leaders" | grep -q 'Ada Relay'
          # Members only: profiles and proof screenshots.
          for path in "/users/$some_id" "/proofs/$some_id"; do
            location="$(curl -s -o /dev/null -w '%{redirect_url}' "$base$path")"
            case "$location" in
              */signin) ;;
              *) echo "$path redirected to '$location', expected /signin"; exit 1 ;;
            esac
          done
          # A malformed id is a 404, not a database error.
          code="$(curl -s -o /dev/null -w '%{http_code}' "$base/quests/not-a-quest")"
          test "$code" = 404 || { echo "/quests/not-a-quest answered $code"; exit 1; }
          # The app can write to the proofs volume under its read-only root.
          docker compose exec -T web sh -c 'touch /data/proofs/.probe && rm /data/proofs/.probe'

      # The seed's live quests were never announced, so the worker queues them and,
      # with announcements off (brief section 14.6), finishes each with a note.
      # That runs the whole loop against the real image without calling Discord.
      - name: The worker drains the outbox
        run: |
          sql() {
            docker compose exec -T postgres sh -c \
              'psql -v ON_ERROR_STOP=1 -tA -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<< "$1"
          }
          for _ in $(seq 30); do
            done_count="$(sql "SELECT count(*) FROM discord_jobs WHERE note = 'announcements of this kind are off'")"
            [ "$done_count" -gt 0 ] && break
            sleep 2
          done
          [ "$done_count" -gt 0 ] || { echo "the worker finished no job"; exit 1; }
          left="$(sql "SELECT count(*) FROM discord_jobs WHERE done_at IS NULL")"
          [ "$left" = 0 ] || { echo "$left jobs not done"; exit 1; }
          docker compose exec -T worker sh -c 'touch /data/proofs/.probe && rm /data/proofs/.probe'
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q worker)")" = healthy

      - name: Readiness fails closed without the database
        run: |
          docker compose stop postgres
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/health/ready)"
          test "$code" = 503 || { echo "readiness answered $code with the database down"; exit 1; }

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Down
        if: always()
        run: docker compose down -v
