name: Secret scan

# Secrets live in 1Password and the host's mode-600 env files. This job asserts
# that rule held: history and the built image are where secrets must be absent.

on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    # A secret committed and reverted still lives in history.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  history:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow clones hide exactly the commits this job exists to find.
          fetch-depth: 0
      # The container, not gitleaks-action: the action needs a paid licence for
      # organisation repos and exits before scanning without one.
      - name: Scan git history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --verbose

  image:
    name: trufflehog (web image filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web image
        run: docker build --target web -t community-scan-target:ci .
      - name: Export the image filesystem
        run: |
          container=$(docker create community-scan-target:ci)
          mkdir -p /tmp/image-fs
          docker export "$container" | tar -x -C /tmp/image-fs
          docker rm "$container"
      - name: Scan
        run: |
          docker run --rm -v /tmp/image-fs:/scan trufflesecurity/trufflehog:latest \
            filesystem /scan --only-verified --fail --no-update
